# Render blueprint: one web service that serves both the API and the built app.
# The database is not created here: paste a hosted Postgres connection string
# (e.g. from Neon) into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: donegeon
    runtime: node
    plan: free
    # Same place as the database (Neon, Frankfurt): every request makes several
    # database calls, and each one pays the distance between the two.
    region: frankfurt
    # The migrations run here, once per deploy, not at every start: the free plan sleeps when idle and starts again on
    # the next visit, and loading Prisma's command line on its tenth of a CPU made every wake-up seconds longer.
    buildCommand: >-
      (cd frontend && npm ci --include=dev && npm run build) &&
      (cd backend && npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy)
    # Node itself, without npm in front (npm start would be the same, a little slower to start).
    startCommand: cd backend && node dist/backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "26"
      - key: SESSION_SECRET
        generateValue: true
      # Who reads the mail sent from the user page; nobody when unset.
      - key: DEV_USERNAMES
        value: reo
      - key: DATABASE_URL
        sync: false
      # Push notifications: `npx web-push generate-vapid-keys`, pasted in by hand. Without them nothing is pushed.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
